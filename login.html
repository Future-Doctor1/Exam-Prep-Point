<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Exam Prep Point</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #0b1120;
      color: white;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      padding: 30px;
      background: #111827;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #374151;
      border-radius: 8px;
      background: #1f2937;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      color: #f87171;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Exam Prep Point</h1>

    <div class="subtitle">
      Admin Panel Login
    </div>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Admin email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

    <div id="message"></div>

  </div>


  <script type="module">

    import {
      auth
    } from "../firebase-config.js";

    import {
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");


    loginForm.addEventListener("submit", async (e) => {

      e.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      message.textContent = "Logging in...";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        window.location.href = "dashboard.html";

      } catch (error) {

        console.error(error);

        message.textContent =
          "Invalid email or password.";

      }

    });

  </script>

</body>
  </html>
